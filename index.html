
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>QR PAY</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header {
  background: #111;
  color: white;
  padding: 24px 22px 30px;
}
.logo { font-size: 25px; font-weight: 900; letter-spacing: 2px; }
.demo { color: #aaa; font-size: 11px; letter-spacing: 2px; }
main { padding: 20px; max-width: 500px; margin: auto; }
.balance {
  background: #111;
  color: white;
  padding: 24px;
  border-radius: 18px;
}
.balance small { color: #aaa; }
.amount { font-size: 36px; font-weight: 800; margin-top: 10px; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
button {
  border: none;
  border-radius: 14px;
  padding: 20px 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.primary { background: #111; color: white; }
.secondary { background: white; color: #111; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-top: 16px;
  overflow-wrap: anywhere;
}
h2 { font-size: 17px; }
.note { color: #888; font-size: 11px; }
nav {
  display: flex;
  justify-content: space-around;
  padding: 18px;
  background: white;
  position: sticky;
  bottom: 0;
}
nav span { font-size: 12px; }
#reader { width: 100%; max-width: 400px; margin: 16px auto; }
#scanResult { margin-top: 16px; }

/* QR PAY V2 — Minimal White visual layer. Existing logic and storage remain unchanged. */
:root{color-scheme:light}
body{background:#f7f7f5;color:#171717;letter-spacing:.01em}
header{background:#fff;color:#111;padding:26px 22px 28px;border-bottom:1px solid #e9e9e6}
.logo{font-size:24px;letter-spacing:2.4px}
.demo{color:#858585;letter-spacing:1.7px}
main{max-width:520px;padding:22px 18px 30px}
.balance{background:#fff;color:#111;border:1px solid #e8e8e5;border-radius:20px;padding:25px;box-shadow:0 8px 24px rgba(0,0,0,.035)}
.balance small{color:#777}
.amount{font-size:38px;letter-spacing:-1.2px}
.actions{gap:10px;margin:16px 0}
button{border-radius:12px;padding:16px 12px;transition:transform .15s ease,opacity .15s ease}
button:active{transform:scale(.98)}
.primary{background:#171717;color:#fff}
.secondary{background:#fff;color:#171717;border:1px solid #e4e4e0}
.panel{background:#fff;border:1px solid #eaeae7;border-radius:16px;padding:18px;margin-top:13px;box-shadow:0 5px 18px rgba(0,0,0,.025)}
h2{font-size:16px;letter-spacing:.01em}
.note{color:#858585}
nav{background:rgba(255,255,255,.97);border-top:1px solid #e8e8e5;padding:14px 10px;box-shadow:0 -5px 18px rgba(0,0,0,.025)}
nav span{color:#555;padding:7px 10px;border-radius:9px;cursor:pointer}
nav span:active{background:#f0f0ed}
#reader{overflow:hidden;border-radius:14px}
details.panel summary{cursor:pointer}
@media(min-width:600px){main{padding-top:28px}.balance{padding:30px}}

/* Customer wallet usability refinement */
body{background:#f4f6f8;color:#17202a}
header{background:#fff;color:#17202a;padding:20px 20px 16px;border-bottom:1px solid #e4e8ec}
.logo{font-size:22px;letter-spacing:2px}
.demo{color:#89939d}
main{max-width:560px;padding:16px 16px 96px}
.balance{background:linear-gradient(135deg,#172b3d,#294c68);color:#fff;border:0;border-radius:20px;padding:25px;box-shadow:0 10px 26px rgba(20,40,60,.13)}
.balance small{color:#d1dbe3}
.actions{grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.actions button{min-height:76px;font-size:15px;line-height:1.45;border-radius:14px}
.actions button:first-child{grid-column:1/-1;min-height:92px;font-size:19px;background:#1476b8}
.actions button:nth-child(2),.actions button:nth-child(3){background:#fff;color:#17202a;border:1px solid #d9e0e6}
.panel{border:1px solid #e4e8ec;border-radius:15px;box-shadow:0 4px 14px rgba(20,40,60,.035)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e0e5e9;box-shadow:0 -4px 16px rgba(20,40,60,.06)}
nav span{flex:1;text-align:center;font-size:12px;font-weight:650;padding:10px 4px}
#reader{border:1px dashed #c6d0d9;background:#f8fafb}

/* QR PAY monochrome wallet theme */
:root{color-scheme:light}
html,body{background:#f4f4f4!important;color:#111!important}
header{background:#fff!important;color:#111!important;border-bottom:1px solid #ddd!important}
header p,.demo,.note{color:#666!important}
.balance{background:#111!important;color:#fff!important;border:1px solid #111!important;box-shadow:0 8px 22px rgba(0,0,0,.10)!important}
.balance small{color:#ddd!important}
.panel,.card,section{background:#fff!important;color:#111!important;border-color:#ddd!important;box-shadow:0 3px 12px rgba(0,0,0,.035)!important}
button,.primary{background:#111!important;color:#fff!important;border:1px solid #111!important}
button.secondary,.secondary{background:#fff!important;color:#111!important;border:1px solid #aaa!important}
input,select,textarea{background:#fff!important;color:#111!important;border:1px solid #aaa!important}
nav{background:#fff!important;color:#111!important;border-top:1px solid #ddd!important}
nav span{color:#111!important}
a{color:#111!important}

</style>
</head>
<body>

<header>
  <div class="logo">QR PAY</div>
  <div class="demo">DEMO PAYMENT SYSTEM</div>
</header>

<main>
  <section class="balance">
    <small>YOUR DEMO BALANCE</small>
    <div class="amount" id="balance">¥10,000</div>
    <small>DEMO MONEY / NO REAL VALUE</small>
  </section>

  <section class="actions">
    <button class="primary" onclick="showPayment()">
      バーコードで支払う
    </button>
    <button class="secondary" onclick="showScanner()">
      お店のQRを読み取る
    </button>
    <button class="secondary" onclick="showTopUp()">デモチャージ</button>
  </section>

<section id="content">
  <section class="panel">
    <h2>今月の利用状況</h2>
    <div id="monthlyTotal">¥0</div>
    <p class="note">今月のデモ利用額</p>
    <div id="monthlyCount">決済 0件</div>
  </section>

  <section class="panel">
    <h2>最近の取引</h2>
    <div id="recentHistory"></div>
  </section>
</section>
</main>

<nav>
 <span onclick="showHome()">ホーム</span>
  <span onclick="showPayment()">支払い</span>
  <span onclick="showHistory()">履歴</span>
  <span onclick="showSettings()">設定</span>
</nav>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
let activeScanner = null;

const balanceKey = "qrpay_demo_balance";
const historyKey = "qrpay_demo_history";

function getBalance() {
  return Number(localStorage.getItem(balanceKey) ?? 10000);
}

function showBalance() {
  document.getElementById("balance").textContent =
    "¥" + getBalance().toLocaleString("ja-JP");
}

showBalance();
showHome();
  
function showPayment() {
  const content=document.getElementById("content");
  const token=crypto.randomUUID(),expiresAt=Date.now()+5*60*1000;
  const payload="QPB1|"+token+"|"+expiresAt;
  content.innerHTML='<section class="panel"><h2>店舗で読み取る支払いバーコード</h2><p>この画面を店舗側のQR PAY STOREカメラに見せてください。</p><div style="background:#fff;padding:14px;border:1px solid #eee;border-radius:12px;text-align:center;overflow:hidden"><svg id="customerBarcode" style="width:100%;max-width:360px;height:110px"></svg><strong>QR PAY DEMO</strong></div><p id="barcodeExpiry" class="note"></p><p class="note">有効期限は5分です。期限切れの場合は再表示してください。</p><p class="note">デモ用コードです。別端末との残高同期・実際の決済は行いません。</p><button class="secondary" onclick="showPayment()">バーコードを更新</button><button class="primary" onclick="showHome()">戻る</button></section>';
  if(typeof JsBarcode==="undefined"){document.getElementById("customerBarcode").outerHTML="<p>バーコードライブラリを読み込めません。通信環境を確認してください。</p>";return;}
  JsBarcode("#customerBarcode",payload,{format:"CODE128",displayValue:false,margin:8,height:76,width:2,background:"#ffffff",lineColor:"#111111"});
  document.getElementById("barcodeExpiry").textContent="有効期限："+new Date(expiresAt).toLocaleTimeString("ja-JP");
}

function showTopUp() {
  document.getElementById("content").innerHTML = `
    <h2>デモチャージ</h2>
    <section class="panel">
      <p>現在のデモ残高</p>
      <h2>¥${getBalance().toLocaleString("ja-JP")}</h2>
      <p class="note">練習用の仮想残高です。実際の入金や店舗でのチャージは行われません。</p>
      <label for="demoTopUpAmount">チャージ金額</label>
      <select id="demoTopUpAmount">
        <option value="500">¥500</option><option value="1000" selected>¥1,000</option>
        <option value="3000">¥3,000</option><option value="5000">¥5,000</option>
      </select>
      <button class="primary" onclick="confirmDemoTopUp()">デモ残高に追加</button>
    </section>`;
}
function confirmDemoTopUp() {
  const amount=Number(document.getElementById("demoTopUpAmount")?.value);
  if(![500,1000,3000,5000].includes(amount)){alert("金額を選び直してください。");return;}
  if(!confirm("デモ残高に¥"+amount.toLocaleString("ja-JP")+"を追加しますか？\\n実際のお金は動きません。"))return;
  const next=getBalance()+amount;
  if(!Number.isSafeInteger(next)||next>1000000){alert("デモ残高の上限を超えます。");return;}
  const history=JSON.parse(localStorage.getItem(historyKey)||"[]");
  history.unshift({requestId:"TOPUP-"+crypto.randomUUID(),store:"QR PAY DEMO CHARGE",amount,date:new Date().toLocaleString("ja-JP"),type:"topup",status:"demo-topup"});
  localStorage.setItem(balanceKey,String(next));
  localStorage.setItem(historyKey,JSON.stringify(history));
  showBalance();showHome();
  document.getElementById("content").innerHTML="<section class='panel'><h2>デモチャージ完了</h2><p>追加額：¥"+amount.toLocaleString("ja-JP")+"</p><p>新しい残高：¥"+next.toLocaleString("ja-JP")+"</p><p class='note'>デモ記録のみです。実際の入金ではありません。</p><button class='primary' onclick='showHome()'>ホームへ戻る</button></section>";
}

async function showScanner() {
  const content = document.getElementById("content");

  if (activeScanner) {
    try {
      await activeScanner.stop();
      activeScanner.clear();
    } catch (e) {}
    activeScanner = null;
  }

  content.innerHTML = `
    <h2>QRコード読み取り</h2>
    <p>店舗のQRコードを読み取ってください。</p>
    <div id="reader"></div>
    <div id="scanResult"></div>
    <button onclick="showScanner()">再読み込み</button>
  `;

  if (typeof Html5Qrcode === "undefined") {
    document.getElementById("scanResult").textContent =
      "読み取りライブラリを読み込めませんでした。";
    return;
  }

  const scanner = new Html5Qrcode("reader");
  activeScanner = scanner;

  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async function(decodedText) {
        try {
          await scanner.stop();
        } catch (e) {}

        activeScanner = null;

        const result = document.getElementById("scanResult");

        try {
          const data = JSON.parse(decodedText);

          if (
            data.type !== "QR_PAY_DEMO" ||
            typeof data.requestId !== "string" ||
            typeof data.amount !== "number" ||
            !Number.isFinite(data.amount) ||
            data.amount <= 0 ||
            data.amount > 100000 ||
            typeof data.store !== "string" ||
            typeof data.expiresAt !== "number"
          ) {
            throw new Error("QRコードの内容が正しくありません。");
          }

          if (Date.now() > data.expiresAt) {
            throw new Error("このQRコードは有効期限切れです。");
          }

          window.pendingDemoPayment = data;

          result.innerHTML = `
            <h3>読み取り成功</h3>
            <p>店舗名：<span id="storeName"></span></p>
            <p>決済金額：<span id="paymentAmount"></span></p>
            <p>状態：未決済（デモ）</p>
            <button onclick="confirmDemoPayment()">
              この内容で決済する
            </button>
          `;

          document.getElementById("storeName").textContent = data.store;
          document.getElementById("paymentAmount").textContent =
            "¥" + data.amount.toLocaleString("ja-JP");

        } catch (error) {
          result.textContent = error.message;
        }
      },
      function(errorMessage) {
        // 読み取り途中のエラーは表示しない
      }
    );

  } catch (error) {
    activeScanner = null;
    document.getElementById("scanResult").textContent =
      "カメラを起動できませんでした。カメラの許可と通信環境を確認してください。";
  }
}

function confirmDemoPayment() {
  const data = window.pendingDemoPayment;

  if (!data) {
    alert("決済情報がありません。");
    return;
  }

  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  if (history.some(item => item.requestId === data.requestId)) {
    alert("このQRコードは使用済みです。");
    return;
  }

  const balance = getBalance();

  if (balance < data.amount) {
    alert("デモ残高が不足しています。");
    return;
  }

  if (!confirm(
    "これはデモ決済です。\n実際のお金は動きません。\n決済を完了しますか？"
  )) {
    return;
  }

  if (Date.now() > data.expiresAt) {
    alert("QRコードの有効期限が切れています。");
    return;
  }

  const newBalance = balance - data.amount;

  history.unshift({
    requestId: data.requestId,
    store: data.store,
    amount: data.amount,
    date: new Date().toLocaleString("ja-JP")
  });

  localStorage.setItem(balanceKey, String(newBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));

  showBalance();

  const result = document.getElementById("scanResult");
  result.innerHTML = `
    <h3>デモ決済完了</h3>
    <p id="paidStore"></p>
    <p>決済金額：¥${data.amount.toLocaleString("ja-JP")}</p>
    <p>残高：¥${newBalance.toLocaleString("ja-JP")}</p>
    <p>取引履歴に保存しました。</p>
  `;

  document.getElementById("paidStore").textContent =
    "店舗：" + data.store;

  window.pendingDemoPayment = null;
}
function cancelDemoPayment(requestId) {
  const history = JSON.parse(localStorage.getItem(historyKey) || "[]");
  const item = history.find(entry => entry.requestId === requestId);
  if (!item || item.status === "cancelled") {
    alert("この取引は取り消せないか、すでに取り消されています。");
    return;
  }
  if (!confirm("このデモ決済を取り消し、デモ残高を復元しますか？\\n実際のお金の返金ではありません。")) return;

  const restoredBalance = getBalance() + Number(item.amount || 0);
  if (!Number.isFinite(restoredBalance) || restoredBalance < 0) {
    alert("残高を安全に更新できませんでした。");
    return;
  }

  item.status = "cancelled";
  item.cancelledAt = new Date().toLocaleString("ja-JP");
  localStorage.setItem(balanceKey, String(restoredBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));
  showBalance();
  showHistory();
}

function showSettings(){
 const content=document.getElementById("content");
 content.innerHTML='<section class="panel"><h2>設定</h2><p>QR PAY DEMO</p><p class="note">このアプリはデモ専用です。実際の決済・入金は行いません。</p><button class="secondary" onclick="showHome()">ホームに戻る</button></section>';
}
function showHome() {
  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  const now = new Date();

  const thisMonth = history.filter(item => {
    const date = new Date(item.date);
    return (
      !isNaN(date.getTime()) &&
      date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth()
    );
  });

  const activeMonth = thisMonth.filter(item => item.status !== "cancelled");
  const total = activeMonth.reduce(
    (sum, item) => sum + Number(item.amount || 0),
    0
  );

  document.getElementById("monthlyTotal").textContent =
    "¥" + total.toLocaleString("ja-JP");

  document.getElementById("monthlyCount").textContent =
    "決済 " + activeMonth.length + "件";

  const recent = document.getElementById("recentHistory");

  recent.innerHTML = history.length === 0
    ? '<p class="note">取引履歴はまだありません。</p>'
    : history.slice(0, 3).map(item => `
        <div class="panel">
          <strong>${String(item.store).replace(/[&<>"']/g, "")}</strong>
          <h3>−¥${Number(item.amount).toLocaleString("ja-JP")}</h3>
          <small>${String(item.date).replace(/[&<>"']/g, "")}</small>
        </div>
      `).join("");
}
function showHistory() {
  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  const content = document.getElementById("content");

  const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

  const activeHistory = history.filter(item => item.status !== "cancelled");
  const total = activeHistory.reduce(
    (sum, item) => sum + Number(item.amount || 0),
    0
  );

  content.innerHTML = `
    <h2>取引履歴</h2>

    <div class="panel">
      <p>累計利用額</p>
      <h2>¥${total.toLocaleString("ja-JP")}</h2>
      <p>有効な取引件数：${history.filter(item => item.status !== "cancelled").length}件</p>
    </div>

    ${
      history.length === 0
        ? `<p class="note">取引履歴はまだありません。</p>`
        : history.map((item, index) => `
          <details class="panel">
            <summary>
              <strong>${escapeHTML(item.store)}</strong>
              <h3>−¥${Number(item.amount).toLocaleString("ja-JP")}</h3>
              <small>${escapeHTML(item.date)}</small>
            </summary>
            <hr>
            <p>店舗：${escapeHTML(item.store)}</p>
            <p>${item.type === "topup" ? "チャージ金額" : "決済金額"}：¥${Number(item.amount).toLocaleString("ja-JP")}</p>
            <p>決済日時：${escapeHTML(item.date)}</p>
            <p>状態：${item.status === "cancelled" ? "取消済み（デモ）" : item.type === "topup" ? "デモチャージ" : "デモ決済完了"}</p>
            <p>取引番号：${escapeHTML(item.requestId)}</p>
            ${item.status === "cancelled" ? "" : `<button class="secondary" onclick="cancelDemoPayment('${escapeHTML(item.requestId)}')">このデモ決済を取り消す</button>`}
          </details>
        `).join("")
    }
  `;
}

</script>

</body>
</html>
