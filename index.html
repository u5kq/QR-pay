
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>QR PAY</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}
header {
  background: #111;
  color: white;
  padding: 24px 22px 30px;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}
.demo { color: #aaa; font-size: 11px; letter-spacing: 2px; }
main { padding: 20px; max-width: 500px; margin: auto; }
.balance {
  background: #111;
  color: white;
  padding: 24px;
  border-radius: 18px;
}
.balance small { color: #aaa; }
.amount { font-size: 36px; font-weight: 800; margin-top: 10px; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
button {
  border: none;
  border-radius: 14px;
  padding: 20px 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.primary { background: #111; color: white; }
.secondary { background: white; color: #111; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-top: 16px;
}
h2 { font-size: 17px; }
.item {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}
.note { color: #888; font-size: 11px; }
nav {
  display: flex;
  justify-content: space-around;
  padding: 18px;
  background: white;
  position: sticky;
  bottom: 0;
}
nav span { font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">QR PAY</div>
  <div class="demo">DEMO PAYMENT SYSTEM</div>
</header>

<main>
  <section class="balance">
    <small>YOUR DEMO BALANCE</small>
    <div class="amount" id="balance">¥10,000</div>
    <small>DEMO MONEY / NO REAL VALUE</small>
  </section>

  <section class="actions">
    <button class="primary" onclick="showPayment()">
      バーコードを表示
    </button>
    <button class="secondary" onclick="showScanner()">
      QRコードを読み取る
    </button>
  </section>

  <section class="panel" id="content">
    <h2>最近の取引</h2>
    <p class="note">取引履歴はまだありません。</p>
  </section>
</main>

<nav>
  <span>ホーム</span>
  <span>支払い</span>
  <span>履歴</span>
  <span>設定</span>
</nav>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
function showPayment() {
  document.getElementById("content").innerHTML =
    "<h2>支払い用バーコード</h2>" +
    "<p>バーコード機能は次の開発工程で実装します。</p>";
}
function showScanner() {
  document.getElementById("content").innerHTML =
    "<h2>QRコード読み取り</h2>" +
    "<p>QR読み取り機能は次の開発工程で実装します。</p>";
}

</script>
</body>
</html>
