
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>QR PAY</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}
header {
  background: #111;
  color: white;
  padding: 24px 22px 30px;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}
.demo { color: #aaa; font-size: 11px; letter-spacing: 2px; }
main { padding: 20px; max-width: 500px; margin: auto; }
.balance {
  background: #111;
  color: white;
  padding: 24px;
  border-radius: 18px;
}
.balance small { color: #aaa; }
.amount { font-size: 36px; font-weight: 800; margin-top: 10px; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
button {
  border: none;
  border-radius: 14px;
  padding: 20px 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.primary { background: #111; color: white; }
.secondary { background: white; color: #111; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-top: 16px;
}
h2 { font-size: 17px; }
.item {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}
.note { color: #888; font-size: 11px; }
nav {
  display: flex;
  justify-content: space-around;
  padding: 18px;
  background: white;
  position: sticky;
  bottom: 0;
}
nav span { font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">QR PAY</div>
  <div class="demo">DEMO PAYMENT SYSTEM</div>
</header>

<main>
  <section class="balance">
    <small>YOUR DEMO BALANCE</small>
    <div class="amount" id="balance">¥10,000</div>
    <small>DEMO MONEY / NO REAL VALUE</small>
  </section>

  <section class="actions">
    <button class="primary" onclick="showPayment()">
      バーコードを表示
    </button>
    <button class="secondary" onclick="showScanner()">
      QRコードを読み取る
    </button>
  </section>

  <section class="panel" id="content">
    <h2>最近の取引</h2>
    <p class="note">取引履歴はまだありません。</p>
  </section>
</main>

<nav>
  <span>ホーム</span>
  <span>支払い</span>
  <span>履歴</span>
  <span>設定</span>
</nav>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
function showPayment() {
  document.getElementById("content").innerHTML =
    "<h2>支払い用バーコード</h2>" +
    "<p>バーコード機能は次の開発工程で実装します。</p>";
} 
  function showScanner() {
    document.getElementById("content").innerHTML = `
        <h2>QRコード読み取り</h2>
        <p>店舗のQRコードを読み取ってください。</p>
        <div id="reader" style="width:100%; max-width:400px;"></div>
        <div id="scanResult"></div>
    `;

    const scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async function(decodedText) {
            await scanner.stop();

            const result = document.getElementById("scanResult");

            try {
                const data = JSON.parse(decodedText);

                if (
                    data.type !== "QR_PAY_DEMO" ||
                    typeof data.amount !== "number" ||
                    !Number.isFinite(data.amount) ||
                    data.amount <= 0 ||
                    typeof data.store !== "string" ||
                    typeof data.expiresAt !== "number"
                ) {
                    throw new Error("QRコードの内容が正しくありません。");
                }

                if (Date.now() > data.expiresAt) {
                    throw new Error("このQRコードは有効期限切れです。");
                }

               window.pendingDemoPayment = data;
              result.innerHTML = `
                    <h3>読み取り成功</h3>
                    <p>店舗名：<span id="storeName"></span></p>
                    <p>決済金額：<span id="paymentAmount"></span></p>
                    <p>状態：未決済（デモ）</p>
                    <button onclick="confirmDemoPayment()">この内容で決済する</button>
                `;

                document.getElementById("storeName").textContent = data.store;
                document.getElementById("paymentAmount").textContent =
                    "¥" + data.amount.toLocaleString("ja-JP");

            } catch (error) {
                result.textContent = error.message;
            }
        },
        
function confirmDemoPayment() {
    const data = window.pendingDemoPayment;

    if (!data) {
        alert("決済情報がありません。");
        return;
    }

    const balance = Number(
        localStorage.getItem("qrpay_demo_balance") ?? 10000
    );

    const history = JSON.parse(
        localStorage.getItem("qrpay_demo_history") || "[]"
    );

    if (history.some(item => item.requestId === data.requestId)) {
        alert("このQRコードは使用済みです。");
        return;
    }

    if (balance < data.amount) {
        alert("デモ残高が不足しています。");
        return;
    }

    if (!confirm("デモ決済を完了しますか？\n実際のお金は動きません。")) {
        return;
    }

    const newBalance = balance - data.amount;

    history.unshift({
        requestId: data.requestId,
        store: data.store,
        amount: data.amount,
        date: new Date().toLocaleString("ja-JP")
    });

    localStorage.setItem("qrpay_demo_balance", newBalance);
    localStorage.setItem("qrpay_demo_history", JSON.stringify(history));

    document.getElementById("balance").textContent =
        "¥" + newBalance.toLocaleString("ja-JP");

    document.getElementById("scanResult").innerHTML = `
        <h3>デモ決済完了</h3>
        <p>店舗：${data.store}</p>
        <p>決済金額：¥${data.amount.toLocaleString("ja-JP")}</p>
        <p>残高：¥${newBalance.toLocaleString("ja-JP")}</p>
        <p>取引履歴に保存しました。</p>
    `;

    window.pendingDemoPayment = null;
}



function confirmDemoPayment() {
const confirmed = confirm(
    "これはデモ決済です。\n実際のお金は動きません。\n決済を完了しますか？"
);

if (!confirmed) {
    return;
}

const result = document.getElementById("scanResult");

result.innerHTML = `
    <h3>デモ決済完了</h3>
    <p>決済の確認が完了しました。</p>
    <p>実際のお金は動いていません。</p>
`;
}
</script>
</body>
</html>
