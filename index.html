
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>QR PAY</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header {
  background: #111;
  color: white;
  padding: 24px 22px 30px;
}
.logo { font-size: 25px; font-weight: 900; letter-spacing: 2px; }
.demo { color: #aaa; font-size: 11px; letter-spacing: 2px; }
main { padding: 20px; max-width: 500px; margin: auto; }
.balance {
  background: #111;
  color: white;
  padding: 24px;
  border-radius: 18px;
}
.balance small { color: #aaa; }
.amount { font-size: 36px; font-weight: 800; margin-top: 10px; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
button {
  border: none;
  border-radius: 14px;
  padding: 20px 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.primary { background: #111; color: white; }
.secondary { background: white; color: #111; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-top: 16px;
  overflow-wrap: anywhere;
}
h2 { font-size: 17px; }
.note { color: #888; font-size: 11px; }
nav {
  display: flex;
  justify-content: space-around;
  padding: 18px;
  background: white;
  position: sticky;
  bottom: 0;
}
nav span { font-size: 12px; }
#reader { width: 100%; max-width: 400px; margin: 16px auto; }
#scanResult { margin-top: 16px; }
</style>
</head>
<body>

<header>
  <div class="logo">QR PAY</div>
  <div class="demo">DEMO PAYMENT SYSTEM</div>
</header>

<main>
  <section class="balance">
    <small>YOUR DEMO BALANCE</small>
    <div class="amount" id="balance">¥10,000</div>
    <small>DEMO MONEY / NO REAL VALUE</small>
  </section>

  <section class="actions">
    <button class="primary" onclick="showPayment()">
      バーコードを表示
    </button>
    <button class="secondary" onclick="showScanner()">
      QRコードを読み取る
    </button>
  </section>

  <section class="panel" id="content">
    <h2>最近の取引</h2>
    <p class="note">取引履歴はまだありません。</p>
  </section>
</main>

<nav>
  <span>ホーム</span>
  <span>支払い</span>
  <span>履歴</span>
  <span>設定</span>
</nav>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
let activeScanner = null;

const balanceKey = "qrpay_demo_balance";
const historyKey = "qrpay_demo_history";

function getBalance() {
  return Number(localStorage.getItem(balanceKey) ?? 10000);
}

function showBalance() {
  document.getElementById("balance").textContent =
    "¥" + getBalance().toLocaleString("ja-JP");
}

showBalance();

function showPayment() {
  document.getElementById("content").innerHTML =
    "<h2>支払い用バーコード</h2>" +
    "<p>バーコード機能は次の開発工程で実装します。</p>";
}

async function showScanner() {
  const content = document.getElementById("content");

  if (activeScanner) {
    try {
      await activeScanner.stop();
      activeScanner.clear();
    } catch (e) {}
    activeScanner = null;
  }

  content.innerHTML = `
    <h2>QRコード読み取り</h2>
    <p>店舗のQRコードを読み取ってください。</p>
    <div id="reader"></div>
    <div id="scanResult"></div>
    <button onclick="showScanner()">再読み込み</button>
  `;

  if (typeof Html5Qrcode === "undefined") {
    document.getElementById("scanResult").textContent =
      "読み取りライブラリを読み込めませんでした。";
    return;
  }

  const scanner = new Html5Qrcode("reader");
  activeScanner = scanner;

  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async function(decodedText) {
        try {
          await scanner.stop();
        } catch (e) {}

        activeScanner = null;

        const result = document.getElementById("scanResult");

        try {
          const data = JSON.parse(decodedText);

          if (
            data.type !== "QR_PAY_DEMO" ||
            typeof data.requestId !== "string" ||
            typeof data.amount !== "number" ||
            !Number.isFinite(data.amount) ||
            data.amount <= 0 ||
            data.amount > 100000 ||
            typeof data.store !== "string" ||
            typeof data.expiresAt !== "number"
          ) {
            throw new Error("QRコードの内容が正しくありません。");
          }

          if (Date.now() > data.expiresAt) {
            throw new Error("このQRコードは有効期限切れです。");
          }

          window.pendingDemoPayment = data;

          result.innerHTML = `
            <h3>読み取り成功</h3>
            <p>店舗名：<span id="storeName"></span></p>
            <p>決済金額：<span id="paymentAmount"></span></p>
            <p>状態：未決済（デモ）</p>
            <button onclick="confirmDemoPayment()">
              この内容で決済する
            </button>
          `;

          document.getElementById("storeName").textContent = data.store;
          document.getElementById("paymentAmount").textContent =
            "¥" + data.amount.toLocaleString("ja-JP");

        } catch (error) {
          result.textContent = error.message;
        }
      },
      function(errorMessage) {
        // 読み取り途中のエラーは表示しない
      }
    );

  } catch (error) {
    activeScanner = null;
    document.getElementById("scanResult").textContent =
      "カメラを起動できませんでした。カメラの許可と通信環境を確認してください。";
  }
}

function confirmDemoPayment() {
  const data = window.pendingDemoPayment;

  if (!data) {
    alert("決済情報がありません。");
    return;
  }

  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  if (history.some(item => item.requestId === data.requestId)) {
    alert("このQRコードは使用済みです。");
    return;
  }

  const balance = getBalance();

  if (balance < data.amount) {
    alert("デモ残高が不足しています。");
    return;
  }

  if (!confirm(
    "これはデモ決済です。\n実際のお金は動きません。\n決済を完了しますか？"
  )) {
    return;
  }

  if (Date.now() > data.expiresAt) {
    alert("QRコードの有効期限が切れています。");
    return;
  }

  const newBalance = balance - data.amount;

  history.unshift({
    requestId: data.requestId,
    store: data.store,
    amount: data.amount,
    date: new Date().toLocaleString("ja-JP")
  });

  localStorage.setItem(balanceKey, String(newBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));

  showBalance();

  const result = document.getElementById("scanResult");
  result.innerHTML = `
    <h3>デモ決済完了</h3>
    <p id="paidStore"></p>
    <p>決済金額：¥${data.amount.toLocaleString("ja-JP")}</p>
    <p>残高：¥${newBalance.toLocaleString("ja-JP")}</p>
    <p>取引履歴に保存しました。</p>
  `;

  document.getElementById("paidStore").textContent =
    "店舗：" + data.store;

  window.pendingDemoPayment = null;
}
</script>

</body>
</html>
