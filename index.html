
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>QR PAY</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header {
  background: #111;
  color: white;
  padding: 24px 22px 30px;
}
.logo { font-size: 25px; font-weight: 900; letter-spacing: 2px; }
.demo { color: #aaa; font-size: 11px; letter-spacing: 2px; }
main { padding: 20px; max-width: 500px; margin: auto; }
.balance {
  background: #111;
  color: white;
  padding: 24px;
  border-radius: 18px;
}
.balance small { color: #aaa; }
.amount { font-size: 36px; font-weight: 800; margin-top: 10px; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
button {
  border: none;
  border-radius: 14px;
  padding: 20px 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.primary { background: #111; color: white; }
.secondary { background: white; color: #111; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-top: 16px;
  overflow-wrap: anywhere;
}
h2 { font-size: 17px; }
.note { color: #888; font-size: 11px; }
nav {
  display: flex;
  justify-content: space-around;
  padding: 18px;
  background: white;
  position: sticky;
  bottom: 0;
}
nav span { font-size: 12px; }
#reader { width: 100%; max-width: 400px; margin: 16px auto; }
#scanResult { margin-top: 16px; }

/* QR PAY V2 — Minimal White visual layer. Existing logic and storage remain unchanged. */
:root{color-scheme:light}
body{background:#f7f7f5;color:#171717;letter-spacing:.01em}
header{background:#fff;color:#111;padding:26px 22px 28px;border-bottom:1px solid #e9e9e6}
.logo{font-size:24px;letter-spacing:2.4px}
.demo{color:#858585;letter-spacing:1.7px}
main{max-width:520px;padding:22px 18px 30px}
.balance{background:#fff;color:#111;border:1px solid #e8e8e5;border-radius:20px;padding:25px;box-shadow:0 8px 24px rgba(0,0,0,.035)}
.balance small{color:#777}
.amount{font-size:38px;letter-spacing:-1.2px}
.actions{gap:10px;margin:16px 0}
button{border-radius:12px;padding:16px 12px;transition:transform .15s ease,opacity .15s ease}
button:active{transform:scale(.98)}
.primary{background:#171717;color:#fff}
.secondary{background:#fff;color:#171717;border:1px solid #e4e4e0}
.panel{background:#fff;border:1px solid #eaeae7;border-radius:16px;padding:18px;margin-top:13px;box-shadow:0 5px 18px rgba(0,0,0,.025)}
h2{font-size:16px;letter-spacing:.01em}
.note{color:#858585}
nav{background:rgba(255,255,255,.97);border-top:1px solid #e8e8e5;padding:14px 10px;box-shadow:0 -5px 18px rgba(0,0,0,.025)}
nav span{color:#555;padding:7px 10px;border-radius:9px;cursor:pointer}
nav span:active{background:#f0f0ed}
#reader{overflow:hidden;border-radius:14px}
details.panel summary{cursor:pointer}
@media(min-width:600px){main{padding-top:28px}.balance{padding:30px}}

</style>
</head>
<body>

<header>
  <div class="logo">QR PAY</div>
  <div class="demo">DEMO PAYMENT SYSTEM</div>
</header>

<main>
  <section class="balance">
    <small>YOUR DEMO BALANCE</small>
    <div class="amount" id="balance">¥10,000</div>
    <small>DEMO MONEY / NO REAL VALUE</small>
  </section>

  <section class="actions">
    <button class="primary" onclick="showPayment()">
      バーコードを表示
    </button>
    <button class="secondary" onclick="showScanner()">
      QRコードを読み取る
    </button>
  </section>

<section id="content">
  <section class="panel">
    <h2>今月の利用状況</h2>
    <div id="monthlyTotal">¥0</div>
    <p class="note">今月のデモ利用額</p>
    <div id="monthlyCount">決済 0件</div>
  </section>

  <section class="panel">
    <h2>最近の取引</h2>
    <div id="recentHistory"></div>
  </section>
</section>
</main>

<nav>
 <span onclick="showHome()">ホーム</span>
  <span>支払い</span>
<span onclick="showHistory()">履歴</span>
  <span>設定</span>
</nav>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
let activeScanner = null;

const balanceKey = "qrpay_demo_balance";
const historyKey = "qrpay_demo_history";

function getBalance() {
  return Number(localStorage.getItem(balanceKey) ?? 10000);
}

function showBalance() {
  document.getElementById("balance").textContent =
    "¥" + getBalance().toLocaleString("ja-JP");
}

showBalance();
showHome();
  
function showPayment() {
  document.getElementById("content").innerHTML =
    "<h2>支払い用バーコード</h2>" +
    "<p>バーコード機能は次の開発工程で実装します。</p>";
}

async function showScanner() {
  const content = document.getElementById("content");

  if (activeScanner) {
    try {
      await activeScanner.stop();
      activeScanner.clear();
    } catch (e) {}
    activeScanner = null;
  }

  content.innerHTML = `
    <h2>QRコード読み取り</h2>
    <p>店舗のQRコードを読み取ってください。</p>
    <div id="reader"></div>
    <div id="scanResult"></div>
    <button onclick="showScanner()">再読み込み</button>
  `;

  if (typeof Html5Qrcode === "undefined") {
    document.getElementById("scanResult").textContent =
      "読み取りライブラリを読み込めませんでした。";
    return;
  }

  const scanner = new Html5Qrcode("reader");
  activeScanner = scanner;

  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async function(decodedText) {
        try {
          await scanner.stop();
        } catch (e) {}

        activeScanner = null;

        const result = document.getElementById("scanResult");

        try {
          const data = JSON.parse(decodedText);

          if (
            data.type !== "QR_PAY_DEMO" ||
            typeof data.requestId !== "string" ||
            typeof data.amount !== "number" ||
            !Number.isFinite(data.amount) ||
            data.amount <= 0 ||
            data.amount > 100000 ||
            typeof data.store !== "string" ||
            typeof data.expiresAt !== "number"
          ) {
            throw new Error("QRコードの内容が正しくありません。");
          }

          if (Date.now() > data.expiresAt) {
            throw new Error("このQRコードは有効期限切れです。");
          }

          window.pendingDemoPayment = data;

          result.innerHTML = `
            <h3>読み取り成功</h3>
            <p>店舗名：<span id="storeName"></span></p>
            <p>決済金額：<span id="paymentAmount"></span></p>
            <p>状態：未決済（デモ）</p>
            <button onclick="confirmDemoPayment()">
              この内容で決済する
            </button>
          `;

          document.getElementById("storeName").textContent = data.store;
          document.getElementById("paymentAmount").textContent =
            "¥" + data.amount.toLocaleString("ja-JP");

        } catch (error) {
          result.textContent = error.message;
        }
      },
      function(errorMessage) {
        // 読み取り途中のエラーは表示しない
      }
    );

  } catch (error) {
    activeScanner = null;
    document.getElementById("scanResult").textContent =
      "カメラを起動できませんでした。カメラの許可と通信環境を確認してください。";
  }
}

function confirmDemoPayment() {
  const data = window.pendingDemoPayment;

  if (!data) {
    alert("決済情報がありません。");
    return;
  }

  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  if (history.some(item => item.requestId === data.requestId)) {
    alert("このQRコードは使用済みです。");
    return;
  }

  const balance = getBalance();

  if (balance < data.amount) {
    alert("デモ残高が不足しています。");
    return;
  }

  if (!confirm(
    "これはデモ決済です。\n実際のお金は動きません。\n決済を完了しますか？"
  )) {
    return;
  }

  if (Date.now() > data.expiresAt) {
    alert("QRコードの有効期限が切れています。");
    return;
  }

  const newBalance = balance - data.amount;

  history.unshift({
    requestId: data.requestId,
    store: data.store,
    amount: data.amount,
    date: new Date().toLocaleString("ja-JP")
  });

  localStorage.setItem(balanceKey, String(newBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));

  showBalance();

  const result = document.getElementById("scanResult");
  result.innerHTML = `
    <h3>デモ決済完了</h3>
    <p id="paidStore"></p>
    <p>決済金額：¥${data.amount.toLocaleString("ja-JP")}</p>
    <p>残高：¥${newBalance.toLocaleString("ja-JP")}</p>
    <p>取引履歴に保存しました。</p>
  `;

  document.getElementById("paidStore").textContent =
    "店舗：" + data.store;

  window.pendingDemoPayment = null;
}
function cancelDemoPayment(requestId) {
  const history = JSON.parse(localStorage.getItem(historyKey) || "[]");
  const item = history.find(entry => entry.requestId === requestId);
  if (!item || item.status === "cancelled") {
    alert("この取引は取り消せないか、すでに取り消されています。");
    return;
  }
  if (!confirm("このデモ決済を取り消し、デモ残高を復元しますか？\\n実際のお金の返金ではありません。")) return;

  const restoredBalance = getBalance() + Number(item.amount || 0);
  if (!Number.isFinite(restoredBalance) || restoredBalance < 0) {
    alert("残高を安全に更新できませんでした。");
    return;
  }

  item.status = "cancelled";
  item.cancelledAt = new Date().toLocaleString("ja-JP");
  localStorage.setItem(balanceKey, String(restoredBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));
  showBalance();
  showHistory();
}

function showHome() {
  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  const now = new Date();

  const thisMonth = history.filter(item => {
    const date = new Date(item.date);
    return (
      !isNaN(date.getTime()) &&
      date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth()
    );
  });

  const activeMonth = thisMonth.filter(item => item.status !== "cancelled");
  const total = activeMonth.reduce(
    (sum, item) => sum + Number(item.amount || 0),
    0
  );

  document.getElementById("monthlyTotal").textContent =
    "¥" + total.toLocaleString("ja-JP");

  document.getElementById("monthlyCount").textContent =
    "決済 " + activeMonth.length + "件";

  const recent = document.getElementById("recentHistory");

  recent.innerHTML = history.length === 0
    ? '<p class="note">取引履歴はまだありません。</p>'
    : history.slice(0, 3).map(item => `
        <div class="panel">
          <strong>${String(item.store).replace(/[&<>"']/g, "")}</strong>
          <h3>−¥${Number(item.amount).toLocaleString("ja-JP")}</h3>
          <small>${String(item.date).replace(/[&<>"']/g, "")}</small>
        </div>
      `).join("");
}
function showHistory() {
  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  const content = document.getElementById("content");

  const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

  const total = history.reduce(
    (sum, item) => sum + Number(item.amount || 0),
    0
  );

  content.innerHTML = `
    <h2>取引履歴</h2>

    <div class="panel">
      <p>累計利用額</p>
      <h2>¥${total.toLocaleString("ja-JP")}</h2>
      <p>取引件数：${history.length}件</p>
    </div>

    ${
      history.length === 0
        ? `<p class="note">取引履歴はまだありません。</p>`
        : history.map((item, index) => `
          <details class="panel">
            <summary>
              <strong>${escapeHTML(item.store)}</strong>
              <h3>−¥${Number(item.amount).toLocaleString("ja-JP")}</h3>
              <small>${escapeHTML(item.date)}</small>
            </summary>
            <hr>
            <p>店舗：${escapeHTML(item.store)}</p>
            <p>決済金額：¥${Number(item.amount).toLocaleString("ja-JP")}</p>
            <p>決済日時：${escapeHTML(item.date)}</p>
            <p>状態：${item.status === "cancelled" ? "取消済み（デモ）" : "デモ決済完了"}</p>
            <p>取引番号：${escapeHTML(item.requestId)}</p>
            ${item.status === "cancelled" ? "" : `<button class="secondary" onclick="cancelDemoPayment('${escapeHTML(item.requestId)}')">このデモ決済を取り消す</button>`}
          </details>
        `).join("")
    }
  `;
}

</script>

</body>
</html>
