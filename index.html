<body>

<header>

</header>

<main>
  <section class="balance">
    <small>YOUR DEMO BALANCE</small>
    <div class="amount" id="balance">¥10,000</div>
    <small>DEMO MONEY / NO REAL VALUE</small>
  </section>

  <section class="actions">
    <button class="primary" onclick="showPayment()">
      バーコードで支払う
    </button>
    <button class="secondary" onclick="showScanner()">
      お店のQRを読み取る
    </button>
    <button class="secondary" onclick="showTopUp()">デモチャージ</button>

  </section>
</section>
</main>

<nav>
 <span onclick="showHome()">ホーム</span>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
let activeScanner = null;

const balanceKey = "qrpay_demo_balance";
const historyKey = "qrpay_demo_history";

function getBalance() {
  return Number(localStorage.getItem(balanceKey) ?? 10000);
}

function showBalance() {
  document.getElementById("balance").textContent =
    "¥" + getBalance().toLocaleString("ja-JP");
}

showBalance();
showHome();
  
function showPayment() {
  const content=document.getElementById("content");
  const token=crypto.randomUUID(),expiresAt=Date.now()+5*60*1000;
  const payload="QPB1|"+token+"|"+expiresAt;
  content.innerHTML='<section class="panel"><h2>店舗で読み取る支払いバーコード</h2><p>この画面を店舗側のQR PAY STOREカメラに見せてください。</p><div style="background:#fff;padding:14px;border:1px solid #eee;border-radius:12px;text-align:center;overflow:hidden"><svg id="customerBarcode" style="width:100%;max-width:360px;height:110px"></svg><strong>QR PAY DEMO</strong></div><p id="barcodeExpiry" class="note"></p><p class="note">有効期限は5分です。期限切れの場合は再表示してください。</p><p class="note">デモ用コードです。店舗との別端末間通信・残高引き落とし・実際の決済は行いません。</p><button class="secondary" onclick="showPayment()">バーコードを更新</button><button class="primary" onclick="showHome()">戻る</button></section>';
  if(typeof JsBarcode==="undefined"){document.getElementById("customerBarcode").outerHTML="<p>バーコードライブラリを読み込めません。通信環境を確認してください。</p>";return;}
  JsBarcode("#customerBarcode",payload,{format:"CODE128",displayValue:false,margin:12,height:110,width:3,background:"#ffffff",lineColor:"#111111"});
  document.getElementById("barcodeExpiry").textContent="有効期限："+new Date(expiresAt).toLocaleTimeString("ja-JP");
}

function showTopUp() {
  document.getElementById("content").innerHTML = `
    <h2>デモチャージ</h2>
    <section class="panel">

async function showScanner() {
  const content = document.getElementById("content");

  if (activeScanner) {
    try {
      await activeScanner.stop();
      activeScanner.clear();
    } catch (e) {}
    activeScanner = null;
  }

  content.innerHTML = `
    <h2>QRコード読み取り</h2>
    <p>店舗のQRコードを読み取ってください。</p>
    <div id="reader"></div>
    <div id="scanResult"></div>
    <button onclick="showScanner()">再読み込み</button>
  `;

  if (typeof Html5Qrcode === "undefined") {
    document.getElementById("scanResult").textContent =
      "読み取りライブラリを読み込めませんでした。";
    return;
  }

  const scanner = new Html5Qrcode("reader");
  activeScanner = scanner;

  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async function(decodedText) {
        try {
          await scanner.stop();
        } catch (e) {}

        activeScanner = null;

        const result = document.getElementById("scanResult");

        try {
          const data = JSON.parse(decodedText);

          if (
            data.type !== "QR_PAY_DEMO" ||
            typeof data.requestId !== "string" ||
            typeof data.amount !== "number" ||
            !Number.isFinite(data.amount) ||
            data.amount <= 0 ||
            data.amount > 100000 ||
            typeof data.store !== "string" ||
            typeof data.expiresAt !== "number"
          ) {
            throw new Error("QRコードの内容が正しくありません。");
          }

          if (Date.now() > data.expiresAt) {
            throw new Error("このQRコードは有効期限切れです。");
          }

          window.pendingDemoPayment = data;

          result.innerHTML = `
            <h3>読み取り成功</h3>
            <p>店舗名：<span id="storeName"></span></p>
            <p>決済金額：<span id="paymentAmount"></span></p>
            <p>状態：未決済（デモ）</p>
            <button onclick="confirmDemoPayment()">
              この内容で決済する
            </button>
          `;

          document.getElementById("storeName").textContent = data.store;
          document.getElementById("paymentAmount").textContent =
            "¥" + data.amount.toLocaleString("ja-JP");

        } catch (error) {
          result.textContent = error.message;
        }
      },
      function(errorMessage) {
        // 読み取り途中のエラーは表示しない
      }
    );

  } catch (error) {
    activeScanner = null;
    document.getElementById("scanResult").textContent =
      "カメラを起動できませんでした。カメラの許可と通信環境を確認してください。";
  }
}

function confirmDemoPayment() {
  const data = window.pendingDemoPayment;

  if (!data) {
    alert("決済情報がありません。");
    return;
  }

  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  if (history.some(item => item.requestId === data.requestId)) {
    alert("このQRコードは使用済みです。");
    return;
  }

  const balance = getBalance();

  if (balance < data.amount) {
    alert("デモ残高が不足しています。");
    return;
  }

  if (!confirm(
    "これはデモ決済です。\n実際のお金は動きません。\n決済を完了しますか？"
  )) {
    return;
  }

  if (Date.now() > data.expiresAt) {
    alert("QRコードの有効期限が切れています。");
    return;
  }

  const newBalance = balance - data.amount;

  history.unshift({
    requestId: data.requestId,
    store: data.store,
    amount: data.amount,
    date: new Date().toLocaleString("ja-JP")
  });

  localStorage.setItem(balanceKey, String(newBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));

  showBalance();

  const result = document.getElementById("scanResult");
  result.innerHTML = `
    <h3>デモ決済完了</h3>
    <p id="paidStore"></p>
    <p>決済金額：¥${data.amount.toLocaleString("ja-JP")}</p>
    <p>残高：¥${newBalance.toLocaleString("ja-JP")}</p>
    <p>取引履歴に保存しました。</p>
  `;

  document.getElementById("paidStore").textContent =
    "店舗：" + data.store;

  window.pendingDemoPayment = null;
}
function cancelDemoPayment(requestId) {
  const history = JSON.parse(localStorage.getItem(historyKey) || "[]");
  const item = history.find(entry => entry.requestId === requestId);
  if (!item || item.status === "cancelled") {
    alert("この取引は取り消せないか、すでに取り消されています。");
    return;
  }
  if (!confirm("このデモ決済を取り消し、デモ残高を復元しますか？\\n実際のお金の返金ではありません。")) return;

  const restoredBalance = getBalance() + Number(item.amount || 0);
  if (!Number.isFinite(restoredBalance) || restoredBalance < 0) {
    alert("残高を安全に更新できませんでした。");
    return;
  }

  item.status = "cancelled";
  item.cancelledAt = new Date().toLocaleString("ja-JP");
  localStorage.setItem(balanceKey, String(restoredBalance));
  localStorage.setItem(historyKey, JSON.stringify(history));
  showBalance();
  showHistory();
}

function showHistory() {

    '"': "&quot;",
    "'": "&#39;"
  })[char]);

  const activeHistory = history.filter(item => item.status !== "cancelled");

    (sum, item) => sum + Number(item.amount || 0),

          </details>
        `).join("")
    }
  `;
  qrFilterHistory();
}
