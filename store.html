
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR PAY STORE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header { background: #111; color: white; padding: 25px; }
.logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
.sub { color: #aaa; font-size: 11px; }
main { max-width: 500px; padding: 20px; margin: auto; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 16px;
}
.sales {
  background: #111;
  color: white;
  padding: 24px;
  border-radius: 16px;
}
.sales small { color: #aaa; }
.amount { font-size: 34px; font-weight: 800; margin-top: 8px; }
button {
  width: 100%;
  padding: 17px;
  border: none;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 15px;
  font-weight: bold;
  margin-top: 10px;
}
input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 18px;
  margin-top: 10px;
}
.note { color: #888; font-size: 11px; }
#qrResult {
  text-align: center;
  margin-top: 20px;
  overflow-wrap: anywhere;
}
#qrcode {
  display: flex;
  justify-content: center;
  margin: 20px auto;
}
#qrcode img, #qrcode canvas {
  max-width: 100%;
  height: auto;
}
</style>
</head>
<body>
<header>
  <div class="logo">QR PAY</div>
  <div class="sub">STORE MANAGEMENT / DEMO</div>
</header>

<main>
  <section class="sales">
    <small>TOTAL DEMO SALES</small>
    <div class="amount">¥25,000</div>
    <small>DEMO DATA / NO REAL MONEY</small>
  </section>

  <section class="panel">
    <h2>バーコード読み取り</h2>
    <p class="note">読み取り機能は次の工程で実装します。</p>
    <button onclick="alert('次の工程で実装します。')">
      スキャナーを開く
    </button>
  </section>

  <section class="panel">
    <h2>QRコード発行</h2>
    <label for="price">決済金額（円）</label>
    <input id="price" type="number" min="1"
      max="100000" placeholder="例：1000">
    <button onclick="createQR()">QRコードを発行</button>

    <div id="qrResult" hidden>
      <h3>決済用QRコード</h3>
      <div id="qrcode"></div>
      <p id="qrAmount"></p>
      <p class="note">DEMO ONLY / NOT A REAL PAYMENT</p>
      <p class="note" id="qrExpiry"></p>
    </div>
  </section>

  <section class="panel">
    <h2>店舗情報</h2>
    <p>店舗名：DEMO STORE</p>
    <p class="note">デモ専用店舗</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function createQR() {
  const price = Number(document.getElementById("price").value);

  if (!Number.isInteger(price) || price < 1 || price > 100000) {
    alert("1円〜100,000円の整数を入力してください。");
    return;
  }

  if (typeof QRCode === "undefined") {
    alert("QRコードライブラリを読み込めませんでした。");
    return;
  }

  const requestId = crypto.randomUUID();
  const expiresAt = Date.now() + 5 * 60 * 1000;

  const demoData = {
    type: "QR_PAY_DEMO",
    requestId: requestId,
    amount: price,
    store: "DEMO STORE",
    expiresAt: expiresAt
  };

  const qrArea = document.getElementById("qrcode");
  qrArea.replaceChildren();

  new QRCode(qrArea, {
    text: JSON.stringify(demoData),
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById("qrAmount").textContent =
    "決済金額：¥" + price.toLocaleString("ja-JP");

  document.getElementById("qrExpiry").textContent =
    "有効期限：約5分（デモ表示）";

  document.getElementById("qrResult").hidden = false;
}
</script>
</body>
</html>
