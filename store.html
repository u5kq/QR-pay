
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>QR PAY STORE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#111;color:white;padding:22px}
header h1{margin:0;font-size:23px;letter-spacing:2px}
header p{margin:6px 0 0;color:#bbb;font-size:12px}
main{max-width:900px;margin:auto;padding:16px}
section{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 14px}
h3{font-size:14px;margin:0 0 10px}
input,button{font:inherit}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:5px 0 12px}
button{border:0;border-radius:8px;padding:12px 15px;background:#111;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#eee;color:#111}
button.danger{background:#eee;color:#a00}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.product{border:1px solid #ddd;border-radius:10px;padding:13px}
.product strong{display:block;margin-bottom:7px}
.price{font-size:18px;font-weight:700;margin:5px 0 12px}
.metric{background:#f5f5f5;border-radius:9px;padding:14px}
.metric small{color:#666}
.metric strong{display:block;font-size:23px;margin-top:6px}
.cart-item,.history-item{border-bottom:1px solid #eee;padding:12px 0}
.cart-item:last-child,.history-item:last-child{border:0}
.cart-item .row{justify-content:space-between}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:7px 12px}
.total{font-size:25px;font-weight:800;text-align:right;margin:16px 0}
.muted{color:#777;font-size:12px}
.status{background:#f3f3f3;border-radius:7px;padding:8px;font-size:12px;display:inline-block}
#qrArea{text-align:center;padding:16px}
#qrcode{display:flex;justify-content:center;margin:16px auto}
#qrcode img{max-width:100%}
.hidden{display:none}
footer{text-align:center;color:#888;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>QR PAY STORE</h1>
  <p>DEMO POS SYSTEM / 店舗管理</p>
</header>

<main>
<section>
  <h2>STORE DASHBOARD</h2>
  <div class="grid">
    <div class="metric">
      <small>QR発行総額</small>
      <strong id="totalIssued">¥0</strong>
    </div>
    <div class="metric">
      <small>QR発行件数</small>
      <strong id="issuedCount">0</strong>
    </div>
    <div class="metric">
      <small>決済確認済み</small>
      <strong>0件</strong>
    </div>
  </div>
  <p class="muted">QR発行額は売上ではありません。別端末の決済結果は自動取得できません。</p>
</section>

<section>
  <h2>商品登録</h2>
  <label>商品名</label>
  <input id="productName" placeholder="例：ジュース">
  <label>価格（円）</label>
  <input id="productPrice" type="number" min="1" max="100000" placeholder="例：150">
  <button onclick="addProduct()">商品を登録</button>
</section>

<section>
  <h2>商品一覧</h2>
  <div id="productList" class="grid"></div>
</section>

<section>
  <h2>カート</h2>
  <div id="cartList"></div>
  <div class="total">合計：<span id="cartTotal">¥0</span></div>
  <div class="row">
    <button onclick="issueQR()" id="issueButton">QRコードを発行</button>
    <button class="secondary" onclick="clearCart()">カートを空にする</button>
  </div>
</section>

<section id="qrSection" class="hidden">
  <h2>QR CODE</h2>
  <div id="qrArea">
    <div id="qrcode"></div>
    <strong id="qrAmount"></strong>
    <p id="qrExpiry" class="muted"></p>
    <p class="status">デモ用QRコード・有効期限5分</p>
  </div>
  <button class="secondary" onclick="closeQR()">閉じる</button>
</section>

<section>
  <h2>QR発行履歴・決済確認</h2>
  <p class="muted">ここに表示される履歴は、このブラウザでのQR発行記録です。</p>
  <div id="historyList"></div>
</section>

<section>
  <h2>データ管理</h2>
  <button class="secondary" onclick="exportData()">データを書き出す</button>
  <button class="danger" onclick="resetDemo()">デモデータを初期化</button>
  <p class="muted">初期化すると商品・カート・発行履歴が消えます。</p>
</section>
</main>

<footer>QR PAY STORE / DEMO ONLY</footer>

<script>
const KEYS={
 products:"qrpay_store_products",
 cart:"qrpay_store_cart",
 issued:"qrpay_store_issued"
};

const defaults=[
 {id:"p1",name:"コーヒー",price:350},
 {id:"p2",name:"紅茶",price:300},
 {id:"p3",name:"サンドイッチ",price:500},
 {id:"p4",name:"ケーキ",price:450}
];

function load(key,fallback){
 try{
  const value=JSON.parse(localStorage.getItem(key));
  return value===null?fallback:value;
 }catch(e){return fallback;}
}

let products=load(KEYS.products,defaults);
let cart=load(KEYS.cart,[]);
let issued=load(KEYS.issued,[]);

function save(){
 localStorage.setItem(KEYS.products,JSON.stringify(products));
 localStorage.setItem(KEYS.cart,JSON.stringify(cart));
 localStorage.setItem(KEYS.issued,JSON.stringify(issued));
}

function yen(value){
 return "¥"+Number(value||0).toLocaleString("ja-JP");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function total(){
 return cart.reduce((sum,item)=>sum+item.price*item.qty,0);
}

function renderProducts(){
 const area=document.getElementById("productList");
 area.innerHTML="";
 products.forEach(product=>{
  const card=document.createElement("div");
  card.className="product";
  const name=document.createElement("strong");
  name.textContent=product.name;
  const price=document.createElement("div");
  price.className="price";
  price.textContent=yen(product.price);
  const add=document.createElement("button");
  add.textContent="カートに追加";
  add.onclick=()=>addToCart(product.id);
  const remove=document.createElement("button");
  remove.className="secondary";
  remove.textContent="商品削除";
  remove.style.marginTop="7px";
  remove.onclick=()=>removeProduct(product.id);
  card.append(name,price,add,remove);
  area.appendChild(card);
 });
}

function addProduct(){
 const name=document.getElementById("productName").value.trim();
 const price=Number(document.getElementById("productPrice").value);
 if(!name||!Number.isInteger(price)||price<1||price>100000){
  alert("商品名と1〜100,000円の整数価格を入力してください。");
  return;
 }
 products.push({id:crypto.randomUUID(),name,price});
 document.getElementById("productName").value="";
 document.getElementById("productPrice").value="";
 save();renderAll();
}

function removeProduct(id){
 if(!confirm("この商品を削除しますか？"))return;
 products=products.filter(p=>p.id!==id);
 save();renderAll();
}

function addToCart(id){
 const product=products.find(p=>p.id===id);
 if(!product)return;
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({...product,qty:1});
 save();renderAll();
}

function changeQty(id,amount){
 const item=cart.find(x=>x.id===id);
 if(!item)return;
 item.qty+=amount;
 cart=cart.filter(x=>x.qty>0);
 save();renderAll();
}

function removeCartItem(id){
 cart=cart.filter(x=>x.id!==id);
 save();renderAll();
}

function clearCart(){
 if(!cart.length)return;
 if(!confirm("カートを空にしますか？"))return;
 cart=[];save();renderAll();
}

function renderCart(){
 const area=document.getElementById("cartList");
 area.innerHTML="";
 if(!cart.length){
  area.textContent="カートは空です。";
 }
 cart.forEach(item=>{
  const row=document.createElement("div");
  row.className="cart-item";
  const top=document.createElement("div");
  top.className="row";
  const info=document.createElement("span");
  info.textContent=item.name+" / "+yen(item.price);
  const subtotal=document.createElement("strong");
  subtotal.textContent=yen(item.price*item.qty);
  top.append(info,subtotal);
  const bottom=document.createElement("div");
  bottom.className="row";
  const qty=document.createElement("div");
  qty.className="qty";
  const minus=document.createElement("button");
  minus.className="secondary";
  minus.textContent="−";
  minus.onclick=()=>changeQty(item.id,-1);
  const number=document.createElement("span");
  number.textContent=item.qty+" 個";
  const plus=document.createElement("button");
  plus.className="secondary";
  plus.textContent="+";
  plus.onclick=()=>changeQty(item.id,1);
  qty.append(minus,number,plus);
  const remove=document.createElement("button");
  remove.className="danger";
  remove.textContent="削除";
  remove.onclick=()=>removeCartItem(item.id);
  bottom.append(qty,remove);
  row.append(top,bottom);
  area.appendChild(row);
 });
 document.getElementById("cartTotal").textContent=yen(total());
 document.getElementById("issueButton").disabled=!cart.length;
}

function issueQR(){
 const amount=total();
 if(!amount||amount>100000){
  alert("合計金額を確認してください。");
  return;
 }
 if(typeof QRCode==="undefined"){
  alert("QRコード機能を読み込めませんでした。通信環境を確認してください。");
  return;
 }

 const requestId=crypto.randomUUID();
 const expiresAt=Date.now()+5*60*1000;
 const payload={
  type:"QR_PAY_DEMO",
  requestId,
  amount,
  store:"DEMO STORE",
  expiresAt
 };

 issued.unshift({
  requestId,
  amount,
  store:"DEMO STORE",
  date:new Date().toISOString(),
  expiresAt,
  status:"issued"
 });

 save();
 document.getElementById("qrcode").innerHTML="";
 new QRCode(document.getElementById("qrcode"),{
  text:JSON.stringify(payload),
  width:220,
  height:220,
  correctLevel:QRCode.CorrectLevel.M
 });

 document.getElementById("qrAmount").textContent=yen(amount);
 document.getElementById("qrExpiry").textContent=
  "有効期限："+new Date(expiresAt).toLocaleTimeString("ja-JP");
 document.getElementById("qrSection").classList.remove("hidden");

 cart=[];
 save();renderAll();
}

function closeQR(){
 document.getElementById("qrSection").classList.add("hidden");
}

function renderHistory(){
 const area=document.getElementById("historyList");
 area.innerHTML="";
 if(!issued.length){
  area.textContent="QR発行履歴はありません。";
 }
 issued.forEach(item=>{
  const row=document.createElement("div");
  row.className="history-item";
  const title=document.createElement("strong");
  title.textContent=yen(item.amount);
  const date=document.createElement("p");
  const parsed=new Date(item.date);
  date.textContent=isNaN(parsed.getTime())?"日時不明":parsed.toLocaleString("ja-JP");
  const status=document.createElement("span");
  status.className="status";
  status.textContent=item.status==="issued"?"QR発行済み・決済未確認":"状態不明";
  row.append(title,date,status);
  area.appendChild(row);
 });
}

function renderDashboard(){
 const amount=issued.reduce((sum,item)=>sum+Number(item.amount||0),0);
 document.getElementById("totalIssued").textContent=yen(amount);
 document.getElementById("issuedCount").textContent=issued.length;
}

function renderAll(){
 renderProducts();
 renderCart();
 renderHistory();
 renderDashboard();
}

function exportData(){
 const data={products,cart,issued,exportedAt:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="qrpay-store-demo-backup.json";
 a.click();
 URL.revokeObjectURL(url);
}

function resetDemo(){
 if(!confirm("商品・カート・QR発行履歴をすべて初期化しますか？"))return;
 products=[...defaults];
 cart=[];
 issued=[];
 save();renderAll();closeQR();
}

renderAll();
</script>
</body>
</html>
