
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>QR PAY STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#111;color:white;padding:22px}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.sub{color:#aaa;font-size:11px}
main{max-width:650px;padding:16px;margin:auto}
.panel{background:white;padding:18px;border-radius:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:16px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin:7px 0 12px}
button{border:0;border-radius:10px;padding:12px;background:#111;color:white;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
button.light{background:#eee;color:#111}
button.danger{background:#eee;color:#b22}
button.small{padding:8px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{background:#f4f4f4;padding:13px;border-radius:12px}
.product button{width:100%;margin-top:8px}
.price{font-weight:800;font-size:18px;margin:8px 0}
.cartitem{padding:12px 0;border-bottom:1px solid #eee}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:7px 12px}
.total{font-size:27px;font-weight:900}
.muted{font-size:11px;color:#888}
.dark{background:#111;color:white;padding:20px;border-radius:15px;margin-bottom:14px}
.dark small{color:#aaa}
#qrcode{display:flex;justify-content:center;margin:20px auto}
#qrcode img,#qrcode canvas{max-width:100%;height:auto}
#qrResult{text-align:center}
.historyitem{padding:12px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header>
 <div class="logo">QR PAY</div>
 <div class="sub">STORE POS SYSTEM / DEMO</div>
</header>

<main>

<section class="dark">
 <small>QR ISSUED TOTAL</small>
 <div class="total" id="issuedTotal">¥0</div>
 <small id="issuedCount">QR発行 0件</small>
 <p class="muted">※決済完了前のQR発行額です。実売上ではありません。</p>
</section>

<section class="panel">
 <h2>商品登録</h2>
 <label>商品名</label>
 <input id="productName" placeholder="例：コーヒー">
 <label>価格（円）</label>
 <input id="productPrice" type="number" min="1" max="100000" placeholder="例：350">
 <button onclick="addProduct()">商品を登録</button>
</section>

<section class="panel">
 <div class="row">
  <h2>商品一覧</h2>
  <span class="muted" id="productCount">0商品</span>
 </div>
 <div class="products" id="products"></div>
</section>

<section class="panel">
 <div class="row">
  <h2>カート</h2>
  <button class="light small" onclick="clearCart()">全削除</button>
 </div>
 <div id="cart"></div>
 <div class="row">
  <strong>商品合計</strong>
  <div class="total" id="cartTotal">¥0</div>
 </div>
 <p class="muted">デモ会計です。実際のお金は動きません。</p>
 <button style="width:100%" onclick="checkout()" id="checkoutButton">
  会計してQRコードを発行
 </button>
</section>

<section class="panel" id="qrResult" hidden>
 <h2>会計用QRコード</h2>
 <div id="qrcode"></div>
 <div class="total" id="qrAmount"></div>
 <p id="qrStatus">QR発行済み・決済未確認</p>
 <p class="muted" id="qrExpiry"></p>
 <button class="light" onclick="closeQR()">閉じる</button>
</section>

<section class="panel">
 <h2>会計履歴</h2>
 <div id="salesHistory"></div>
</section>

<section class="panel">
 <h2>店舗情報</h2>
 <strong>DEMO STORE</strong>
 <p class="muted">QR PAY DEMO POS</p>
 <button class="light" onclick="resetDemo()" style="width:100%">
  デモデータを初期化
 </button>
</section>

<p class="muted" style="text-align:center">
QR PAY STORE / DEMO ONLY / NO REAL MONEY
</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const productKey="qrpay_store_products";
const cartKey="qrpay_store_cart";
const salesKey="qrpay_store_issued";

const initialProducts=[
 {id:"p1",name:"コーヒー",price:350},
 {id:"p2",name:"紅茶",price:300},
 {id:"p3",name:"サンドイッチ",price:500},
 {id:"p4",name:"ケーキ",price:450}
];

function load(key,fallback){
 try{
  const value=localStorage.getItem(key);
  return value===null?fallback:JSON.parse(value);
 }catch(e){return fallback}
}

let products=load(productKey,initialProducts);
let cart=load(cartKey,[]);
let issued=load(salesKey,[]);

function save(){
 localStorage.setItem(productKey,JSON.stringify(products));
 localStorage.setItem(cartKey,JSON.stringify(cart));
 localStorage.setItem(salesKey,JSON.stringify(issued));
}

function yen(value){
 return "¥"+Number(value).toLocaleString("ja-JP");
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function addProduct(){
 const name=document.getElementById("productName").value.trim();
 const price=Number(document.getElementById("productPrice").value);

 if(!name||!Number.isInteger(price)||price<1||price>100000){
  alert("商品名と1〜100,000円の整数を入力してください。");
  return;
 }

 products.push({
  id:crypto.randomUUID(),
  name:name,
  price:price
 });

 save();
 document.getElementById("productName").value="";
 document.getElementById("productPrice").value="";
 render();
}

function addCart(id){
 const product=products.find(p=>p.id===id);
 if(!product)return;

 const item=cart.find(p=>p.id===id);
 if(item)item.qty++;
 else cart.push({...product,qty:1});

 save();
 render();
}

function changeQty(id,amount){
 const item=cart.find(p=>p.id===id);
 if(!item)return;

 item.qty+=amount;
 if(item.qty<=0)cart=cart.filter(p=>p.id!==id);

 save();
 render();
}

function removeCart(id){
 cart=cart.filter(p=>p.id!==id);
 save();
 render();
}

function clearCart(){
 if(cart.length===0)return;
 if(!confirm("カートを空にしますか？"))return;
 cart=[];
 save();
 render();
}

function getTotal(){
 return cart.reduce((sum,item)=>sum+item.price*item.qty,0);
}

function render(){
 const productArea=document.getElementById("products");

 document.getElementById("productCount").textContent=
  products.length+"商品";

 productArea.innerHTML=products.map(p=>`
  <div class="product">
   <strong>${safe(p.name)}</strong>
   <div class="price">${yen(p.price)}</div>
   <button onclick="addCart('${safe(p.id)}')">カートに追加</button>
   <button class="light small" onclick="deleteProduct('${safe(p.id)}')">商品削除</button>
  </div>
 `).join("")||"<p>商品がありません。</p>";

 document.getElementById("cart").innerHTML=
  cart.length===0?"<p class='muted'>商品を追加してください。</p>":
  cart.map(item=>`
   <div class="cartitem">
    <div class="row">
     <strong>${safe(item.name)}</strong>
     <strong>${yen(item.price*item.qty)}</strong>
    </div>
    <div class="row">
     <div class="qty">
      <button class="light" onclick="changeQty('${safe(item.id)}',-1)">−</button>
      <span>${item.qty}個</span>
      <button class="light" onclick="changeQty('${safe(item.id)}',1)">＋</button>
     </div>
     <button class="danger small" onclick="removeCart('${safe(item.id)}')">削除</button>
    </div>
   </div>
  `).join("");

 document.getElementById("cartTotal").textContent=yen(getTotal());
 document.getElementById("checkoutButton").disabled=cart.length===0;

 const totalIssued=issued.reduce((sum,item)=>sum+item.amount,0);

 document.getElementById("issuedTotal").textContent=yen(totalIssued);
 document.getElementById("issuedCount").textContent=
  "QR発行 "+issued.length+"件";

 document.getElementById("salesHistory").innerHTML=
  issued.length===0?"<p class='muted'>会計履歴はありません。</p>":
  issued.map(item=>`
   <div class="historyitem">
    <strong>${yen(item.amount)}</strong>
    <p class="muted">${safe(item.date)}</p>
    <p class="muted">QR発行済み・決済未確認</p>
   </div>
  `).join("");
}

function checkout(){
 const total=getTotal();

 if(total<1||total>100000){
  alert("合計金額は1〜100,000円にしてください。");
  return;
 }

 if(typeof QRCode==="undefined"){
  alert("QRコードライブラリを読み込めませんでした。");
  return;
 }

 const requestId=crypto.randomUUID();
 const expiresAt=Date.now()+5*60*1000;

 const demoData={
  type:"QR_PAY_DEMO",
  requestId:requestId,
  amount:total,
  store:"DEMO STORE",
  expiresAt:expiresAt
 };

 const area=document.getElementById("qrcode");
 area.replaceChildren();

 new QRCode(area,{
  text:JSON.stringify(demoData),
  width:230,
  height:230,
  correctLevel:QRCode.CorrectLevel.M
 });

 document.getElementById("qrAmount").textContent=yen(total);
 document.getElementById("qrExpiry").textContent=
  "有効期限：約5分";

 document.getElementById("qrResult").hidden=false;

 issued.unshift({
  requestId:requestId,
  amount:total,
  date:new Date().toLocaleString("ja-JP"),
  status:"issued",
  items:cart.map(item=>({...item}))
 });

 save();
 render();

 document.getElementById("qrResult").scrollIntoView({
  behavior:"smooth"
 });
}

function closeQR(){
 document.getElementById("qrResult").hidden=true;
}

function deleteProduct(id){
 if(cart.some(item=>item.id===id)){
  alert("先にカートからこの商品を削除してください。");
  return;
 }

 if(!confirm("この商品を削除しますか？"))return;

 products=products.filter(p=>p.id!==id);
 save();
 render();
}

function resetDemo(){
 if(!confirm("商品・カート・会計履歴を初期化しますか？"))return;

 localStorage.removeItem(productKey);
 localStorage.removeItem(cartKey);
 localStorage.removeItem(salesKey);

 products=[...initialProducts];
 cart=[];
 issued=[];

 document.getElementById("qrResult").hidden=true;
 save();
 render();
}

render();
</script>
</body>
</html>
